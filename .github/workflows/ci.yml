name: CI/CD
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage gate (80%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Measure alert tuning
        run: python scripts/tune.py
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t roshan-log-monitor .
      - name: Smoke test (ingest mode prints JSON)
        run: docker run --rm -e MODE=ingest roshan-log-monitor sh -c "timeout 5 python -m app.ingest logs/sample.log | head -3"
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env: {HOOK: "${{ secrets.RENDER_DEPLOY_HOOK }}"}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK secret not set - skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
